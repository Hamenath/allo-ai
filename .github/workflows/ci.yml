name: ALLO CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Security Test Suite
        run: npm test

      - name: Run Production Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://alloai.in"
          NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "allo-dev.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "allo-dev"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "allo-dev.appspot.com"
